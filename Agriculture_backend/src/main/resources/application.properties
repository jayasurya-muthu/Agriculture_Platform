# ===== Server =====
server.port=8080

# ===== MySQL Datasource =====
# Create the database first:  CREATE DATABASE global_agriculture;
spring.datasource.url=jdbc:mysql://localhost:3306/globalagriculture
spring.datasource.username=root
spring.datasource.password=MuthuManju7999
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = creates/alters tables automatically from the entities below.
# Switch to "validate" once your schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Jackson =====
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Logging =====
logging.level.com.globalagriculture.backend=INFO
